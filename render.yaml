services:
  - type: web
    name: staywell-hms
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run db:generate && npm run build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm run start --workspace apps/api
    initialDeployHook: npm run db:seed --workspace apps/api
    healthCheckPath: /api/health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: WEB_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Hotel Administrator
